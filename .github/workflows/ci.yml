name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies (skip postinstall — needs CUDA/whisper.cpp)
        run: npm ci --ignore-scripts
      - name: Run ESLint
        run: npm run lint:check

  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies (skip postinstall)
        run: npm ci --ignore-scripts
      - name: Verify generated translations
        run: npm run i18n:check
      - name: Run smoke test
        run: npm test
      - name: Check Prettier formatting
        run: npm run format:check
      - name: Install Electron display deps
        run: |
          sudo apt-get update -qq
          # Ubuntu 24.04 runners dropped the libasound2 transitional package (now libasound2t64).
          sudo apt-get install -y -qq xvfb libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libgtk-3-0 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 xdg-utils
      - name: Run E2E smoke test (headless)
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          E2E_REQUIRED: '1'
