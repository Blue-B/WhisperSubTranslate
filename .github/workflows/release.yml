name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v2.0.1 && git push origin v2.0.1
# Builds the Windows portable app natively (no wine), zips it, and publishes
# a GitHub Release with notes from release-notes/<tag>.md or CHANGELOG.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] v4 cache disabled below
        with:
          node-version: '22'
          cache: '' # release artifacts must never restore a writable dependency cache

      # 태그(v*)와 package.json 버전이 어긋나면 릴리스 산출물 이름과 body가
      # 불일치하므로 빌드 전에 검증한다.
      - name: Verify tag matches package.json version
        shell: pwsh
        env:
          # git 태그명에는 따옴표·백틱·$() 등이 허용되므로 ref_name을 스크립트에
          # 직접 삽입하지 않고 env로 건넨다(GitHub 보안 하드닝 가이드).
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          $pkg = node -p "require('./package.json').version"
          if (-not $tag.StartsWith('v')) { Write-Error "Tag must start with 'v', got: $tag"; exit 1 }
          $tagVer = $tag.Substring(1)
          if ($tagVer -ne $pkg) {
            Write-Error "Tag version ($tagVer) does not match package.json version ($pkg)"
            exit 1
          }
          Write-Host "Tag $tag matches package.json version $pkg"

      # postinstall.js downloads the prebuilt whisper.cpp (whisper-cli.exe).
      # GITHUB_TOKEN raises the GitHub API rate limit used during that fetch.
      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder config copies ./ffprobe.exe as an extraResource, but
      # the binary is gitignored. Stage it from the ffprobe-static package.
      - name: Stage ffprobe.exe at repo root
        shell: pwsh
        run: |
          $src = "node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe"
          if (-not (Test-Path $src)) { throw "ffprobe-static binary missing: $src" }
          Copy-Item $src "ffprobe.exe" -Force
          Write-Host "Staged ffprobe.exe ($((Get-Item ffprobe.exe).Length) bytes)"

      - name: Sanity-check whisper-cpp download
        shell: pwsh
        run: |
          # main.js always falls back to whisper-cpp/whisper-cli.exe, so the
          # top-level binary is mandatory; cpu/ is an optional CUDA fallback.
          # Each binary needs whisper.dll beside it or spawn() fails as ENOENT.
          $required = @(
            "whisper-cpp/whisper-cli.exe", "whisper-cpp/whisper.dll",
            "whisper-cpp/vulkan/whisper-cli.exe", "whisper-cpp/vulkan/ggml-vulkan.dll",
            "whisper-cpp/vulkan/ggml.dll", "whisper-cpp/vulkan/ggml-base.dll", "whisper-cpp/vulkan/ggml-cpu.dll"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing required whisper.cpp files ($($missing -join ', ')) - postinstall download failed; aborting release"
            Get-ChildItem -Recurse whisper-cpp -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          Write-Host "CUDA and Vulkan whisper-cli bundles are present: $($required -join ', ')"
          $vulkanHash = (Get-FileHash "whisper-cpp/vulkan/whisper-cli.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Vulkan CLI SHA-256: $vulkanHash"
          # whisper-cli는 usage를 stderr로 쓴다. pwsh 스텝은 ErrorActionPreference가 Stop이라
          # 그대로 두면 정상 실행도 NativeCommandError로 죽는다(아래 샘플 전사 스텝과 동일).
          $ErrorActionPreference = 'Continue'
          $vulkanHelp = & "whisper-cpp/vulkan/whisper-cli.exe" --help 2>&1 | Out-String
          $vulkanExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($vulkanExit -ne 0 -or [string]::IsNullOrWhiteSpace($vulkanHelp)) {
            Write-Error "Vulkan whisper-cli failed its runtime --help probe (exit $vulkanExit); aborting release"
            exit 1
          }
          if (Test-Path "whisper-cpp/cpu/whisper-cli.exe") {
            if (-not (Test-Path "whisper-cpp/cpu/whisper.dll")) {
              Write-Error "whisper-cpp/cpu/whisper-cli.exe ships without cpu/whisper.dll; aborting release"
              exit 1
            }
            Write-Host "CPU fallback build present"
          }
          # postinstall이 실패 흔적(install-failed.txt)을 남겼으면 abort.
          if (Test-Path "whisper-cpp/install-failed.txt") {
            Write-Error "postinstall recorded a failure (whisper-cpp/install-failed.txt); aborting release"
            Get-Content "whisper-cpp/install-failed.txt"
            exit 1
          }

      # 파일 존재 검사만으로는 엔진이 실제로 동작하는지 알 수 없다. v2.4.4가
      # 검증되지 않은 whisper.cpp 빌드를 실어 나간 이유가 이 구멍이다.
      # tiny 모델로 저장소의 nya.wav를 실제 전사해 SRT가 나오는지 확인한다.
      - name: Transcribe a real sample with the bundled whisper-cli
        shell: pwsh
        run: |
          $model = "whisper-cpp/ggml-tiny.bin"
          # main.js의 GGML_MODEL_REVISION / GGML_MODEL_MANIFEST.tiny와 동일한 고정값.
          Invoke-WebRequest -UseBasicParsing -OutFile $model `
            -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-tiny.bin"
          $expectedSize = 77691713
          $expectedSha256 = "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21"
          $modelSize = (Get-Item $model).Length
          if ($modelSize -ne $expectedSize) {
            Write-Error "ggml-tiny.bin size mismatch (expected $expectedSize, got $modelSize); aborting release"
            exit 1
          }
          $modelHash = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelHash -ne $expectedSha256) {
            Write-Error "ggml-tiny.bin SHA-256 mismatch (expected $expectedSha256, got $modelHash); aborting release"
            exit 1
          }
          $out = "$env:RUNNER_TEMP/release-transcribe-check"
          # whisper-cli는 진행 상황을 stderr로 쓴다. pwsh 스텝은 ErrorActionPreference가
          # Stop이라 그대로 두면 정상 실행도 NativeCommandError로 죽는다.
          $ErrorActionPreference = 'Continue'
          & "whisper-cpp/whisper-cli.exe" -m $model -f "nya.wav" -osrt -of $out -l en 2>&1 | Out-Null
          $transcribeExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($transcribeExit -ne 0) {
            Write-Error "Bundled whisper-cli.exe exited with $transcribeExit on a known-good sample; aborting release"
            exit 1
          }
          if (-not (Test-Path "$out.srt")) {
            Write-Error "whisper-cli.exe exited 0 but produced no SRT; aborting release"
            exit 1
          }
          $srt = (Get-Content "$out.srt" -Raw).Trim()
          if (-not ($srt -match '\d+:\d{2}:\d{2},\d{3} --> ')) {
            Write-Error "SRT has no usable cue timings; aborting release`n$srt"
            exit 1
          }
          Write-Host "Bundled engine transcribed the sample:`n$srt"

          # Hosted Windows runners may expose no Vulkan device. When a device is present,
          # require a real transcription and proof that whisper used the Vulkan backend.
          $vulkanOut = "$env:RUNNER_TEMP/release-vulkan-transcribe-check"
          $ErrorActionPreference = 'Continue'
          $vulkanLog = & "whisper-cpp/vulkan/whisper-cli.exe" `
            -m $model -f "nya.wav" -osrt -of $vulkanOut -l en 2>&1 | Out-String
          $vulkanTranscribeExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Write-Host "Vulkan transcription probe output:`n$vulkanLog"

          $vulkanDeviceMatch = [regex]::Match(
            $vulkanLog,
            'ggml_vulkan:\s*Found\s+(\d+)\s+Vulkan devices:'
          )
          $vulkanNoGpu = $vulkanLog -match 'whisper_backend_init_gpu:\s+no GPU found'
          if ($vulkanDeviceMatch.Success) {
            $vulkanDeviceCount = [int]$vulkanDeviceMatch.Groups[1].Value
          } elseif ($vulkanNoGpu) {
            $vulkanDeviceCount = 0
          } else {
            Write-Error "Vulkan probe did not report an unambiguous device count; aborting release"
            exit 1
          }
          if ($vulkanDeviceCount -eq 0) {
            Write-Warning "Hosted runner reported 0 Vulkan devices; hardware transcription gate skipped"
          } else {
            if ($vulkanTranscribeExit -ne 0) {
              Write-Error "Vulkan whisper-cli exited with $vulkanTranscribeExit despite detecting $vulkanDeviceCount device(s); aborting release"
              exit 1
            }
            if (-not (Test-Path "$vulkanOut.srt")) {
              Write-Error "Vulkan whisper-cli exited 0 but produced no SRT; aborting release"
              exit 1
            }
            if (-not ($vulkanLog -match 'whisper_backend_init_gpu:\s+using Vulkan\d+ backend')) {
              Write-Error "Vulkan devices were detected but the Vulkan backend was not used; aborting release"
              exit 1
            }
            $vulkanSrt = (Get-Content "$vulkanOut.srt" -Raw).Trim()
            if (-not ($vulkanSrt -match '\d+:\d{2}:\d{2},\d{3} --> ')) {
              Write-Error "Vulkan SRT has no usable cue timings; aborting release`n$vulkanSrt"
              exit 1
            }
            Write-Host "Vulkan engine transcribed the sample with its GPU backend:`n$vulkanSrt"
          }
          Remove-Item $model -Force

      # 새 바이너리가 백신(특히 Defender)에 오탐되는지 출시 전에 확인한다.
      # v2.4.4가 새 whisper.cpp 빌드를 실은 직후 Defender ML 오탐으로 사용자
      # 추출이 막힌 사례(upstream #3974 동일 계열)의 재발 방지.
      # VIRUSTOTAL_API_KEY 시크릿이 없으면 검사는 SKIP으로 통과한다.
      - name: VirusTotal pre-scan of bundled binaries
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: pwsh
        run: |
          # -Include는 경로가 와일드카드로 끝나거나 -Recurse일 때만 적용된다.
          # 와일드카드 없이 쓰면 cpu/vulkan 바이너리 전체가 스캔 누락됐다.
          $targets = @("whisper-cpp/whisper-cli.exe", "whisper-cpp/whisper.dll") + `
            (Get-ChildItem "whisper-cpp/cpu/*" -Include *.exe,*.dll -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }) + `
            (Get-ChildItem "whisper-cpp/vulkan/*" -Include *.exe,*.dll -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          node scripts/virustotal-check.js @targets

      - name: Lint + smoke test + e2e
        run: npm run check:full

      - name: Build Windows app (electron-builder, dir target)
        run: npm run build-win

      - name: Package portable zip
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $zip = "dist2/WhisperSubTranslate-${env:TAG_NAME}-win-x64.zip"
          if (-not (Test-Path "dist2/win-unpacked")) { throw "dist2/win-unpacked not found - build failed?" }
          Compress-Archive -Path "dist2/win-unpacked/*" -DestinationPath $zip -Force
          Write-Host "Created $zip ($((Get-Item $zip).Length) bytes)"

      # afterPack.js의 CUDA DLL 복사 등은 실패해도 빌드가 죽지 않으므로("never
      # throws"), 압축 결과물 안에 필수 항목이 실제로 있는지 언팩해 확인한다.
      - name: Verify packaged zip layout
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $zip = "dist2/WhisperSubTranslate-${env:TAG_NAME}-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "zip not found: $zip" }
          $checkDir = "$env:RUNNER_TEMP/zip-layout-check"
          if (Test-Path $checkDir) { Remove-Item $checkDir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $checkDir -Force
          $required = @(
            "resources/app.asar",
            "resources/LICENSE",
            "resources/THIRD_PARTY_NOTICES.md",
            "resources/ffprobe.exe",
            "resources/whisper-cpp/vulkan/whisper-cli.exe",
            "resources/whisper-cpp/vulkan/ggml-vulkan.dll",
            "resources/app.asar.unpacked/node_modules/@node-llama-cpp/win-x64-cuda/bins/win-x64-cuda/cudart64_12.dll",
            "resources/app.asar.unpacked/node_modules/@node-llama-cpp/win-x64-cuda/bins/win-x64-cuda/cublas64_12.dll",
            "resources/app.asar.unpacked/node_modules/@node-llama-cpp/win-x64-cuda/bins/win-x64-cuda/cublasLt64_12.dll"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $checkDir $_)) }
          if ($missing) {
            Write-Error "Packaged zip is missing required entries ($($missing -join ', ')); aborting release"
            exit 1
          }
          Write-Host "Packaged zip layout OK ($($required.Count) required entries present)"

      # 다운로더가 무결성을 검증할 수 있도록 zip 옆에 SHA-256 체크섬을 게시한다.
      - name: Create zip checksum
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $zip = "dist2/WhisperSubTranslate-${env:TAG_NAME}-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "zip not found: $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          # Linux sha256sum -c 호환: BOM 없는 UTF-8 + LF 한 줄을 명시 기록한다.
          $sumsPath = Join-Path (Get-Location).Path "$zip.sha256"
          [IO.File]::WriteAllText($sumsPath, "$hash  $(Split-Path $zip -Leaf)`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "Wrote $zip.sha256 -> $(Get-Content "$zip.sha256")"

      - name: Build release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/release-notes.js "$env:TAG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: WhisperSubTranslate ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            dist2/WhisperSubTranslate-${{ github.ref_name }}-win-x64.zip
            dist2/WhisperSubTranslate-${{ github.ref_name }}-win-x64.zip.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
