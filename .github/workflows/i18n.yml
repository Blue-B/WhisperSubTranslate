name: i18n

# Weblate changes only the JSON source files. After unprivileged CI finishes,
# this trusted default-branch workflow regenerates the bundled browser file on
# the Weblate branch. It fetches fixed JSON paths and executes no PR code.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only JSON data is fetched; all executed code comes from main
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: i18n-build-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Update generated locale bundle
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'weblate' &&
      github.event.workflow_run.head_repository.full_name == 'weblate/WhisperSubTranslate' &&
      github.event.workflow_run.head_branch == 'weblate-whispersubtranslate-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted generator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Regenerate and update Weblate branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REF: weblate-whispersubtranslate-ui
          HEAD_REPO: weblate/WhisperSubTranslate
        run: |
          for lang in ko en ja zh pl; do
            gh api --method GET "repos/$HEAD_REPO/contents/locales/$lang.json" \
              -f ref="$HEAD_SHA" --jq .content | tr -d '\n' | base64 -d \
              > "base/locales/$lang.json"
          done

          node base/scripts/build-i18n.js

          gh api --method GET "repos/$HEAD_REPO/contents/locales/i18n.js" \
            -f ref="$HEAD_SHA" --jq .content | tr -d '\n' | base64 -d \
            > "$RUNNER_TEMP/current-i18n.js"
          if cmp -s base/locales/i18n.js "$RUNNER_TEMP/current-i18n.js"; then
            echo "locales/i18n.js already in sync, nothing to commit."
            exit 0
          fi

          current_head=$(gh api "repos/$HEAD_REPO/commits/$HEAD_REF" --jq .sha)
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "Weblate branch moved during generation; the next CI run will retry."
            exit 0
          fi

          file_sha=$(gh api --method GET "repos/$HEAD_REPO/contents/locales/i18n.js" \
            -f ref="$HEAD_SHA" --jq .sha)
          export file_sha
          python3 - <<'PY'
          import base64
          import json
          import os

          with open("base/locales/i18n.js", "rb") as source:
              content = base64.b64encode(source.read()).decode()
          payload = {
              "message": "chore(i18n): regenerate locales/i18n.js",
              "content": content,
              "sha": os.environ["file_sha"],
              "branch": os.environ["HEAD_REF"],
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "i18n-update.json"), "w") as target:
              json.dump(payload, target)
          PY
          gh api --method PUT "repos/$HEAD_REPO/contents/locales/i18n.js" \
            --input "$RUNNER_TEMP/i18n-update.json" --silent
