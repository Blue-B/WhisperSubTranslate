name: Engine update check

# whisper.cpp는 scripts/postinstall.js의 WHISPER_CPP_VERSION으로 고정되어 있다.
# 이 워크플로가 월 1회 업스트림 최신 릴리스를 확인하고, 새 버전이 있으면
# 실제 음성 추출 테스트 + VirusTotal 검사를 돌린 뒤 결과를 담은 PR을 연다.
# 머지 여부는 사람이 결정한다 — 검증 없이 엔진이 바뀌는 일은 없다.

on:
  schedule:
    - cron: '17 3 3 * *' # 매월 3일 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Compare pinned engine with upstream latest
        id: compare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path scripts/postinstall.js -Pattern "WHISPER_CPP_VERSION = '([^']+)'"
          $pinned = $m.Matches[0].Groups[1].Value
          $latest = gh api repos/ggml-org/whisper.cpp/releases/latest --jq .tag_name
          Write-Host "pinned=$pinned latest=$latest"
          "pinned=$pinned" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT
          if ($pinned -eq $latest) {
            Write-Host "Engine is up to date."
            "update=false" >> $env:GITHUB_OUTPUT
          } else {
            $existing = gh pr list --state open --head "engine-update/$latest" --json number --jq length
            if ($existing -gt 0) {
              Write-Host "PR for $latest already open."
              "update=false" >> $env:GITHUB_OUTPUT
            } else {
              "update=true" >> $env:GITHUB_OUTPUT
            }
          }

      - name: Transcription test with the new engine
        if: steps.compare.outputs.update == 'true'
        id: transcribe
        shell: pwsh
        run: |
          $tag = "${{ steps.compare.outputs.latest }}"
          Invoke-WebRequest -UseBasicParsing -OutFile engine.zip `
            -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/$tag/whisper-bin-x64.zip"
          Expand-Archive engine.zip -DestinationPath engine-test -Force
          $cli = (Get-ChildItem -Recurse -Filter whisper-cli.exe engine-test | Select-Object -First 1).FullName
          Invoke-WebRequest -UseBasicParsing -OutFile ggml-tiny.bin `
            -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin"
          # whisper-cli는 진행 상황을 stderr로 쓴다 — Stop이면 정상 실행도 죽는다.
          $ErrorActionPreference = 'Continue'
          & $cli -m ggml-tiny.bin -f nya.wav -osrt -of engine-check -l en 2>&1 | Out-Null
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $ok = ($code -eq 0) -and (Test-Path "engine-check.srt") -and `
            ((Get-Content "engine-check.srt" -Raw) -match '\d+:\d{2}:\d{2},\d{3} --> ')
          $result = if ($ok) { 'PASS' } else { 'FAIL (exit=' + $code + ')' }
          "result=$result" >> $env:GITHUB_OUTPUT
          Write-Host "transcription: $result"

      - name: VirusTotal check of the new binaries
        if: steps.compare.outputs.update == 'true'
        id: virustotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $cli = (Get-ChildItem -Recurse -Filter whisper-cli.exe engine-test | Select-Object -First 1)
          $dll = Get-ChildItem -Path $cli.DirectoryName -Filter whisper.dll
          $ErrorActionPreference = 'Continue'
          $log = node scripts/virustotal-check.js $cli.FullName $dll.FullName 2>&1 | Out-String
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Write-Host $log
          "result=$(if ($code -eq 0) { 'CLEAN or SKIPPED' } else { 'MICROSOFT DETECTION — do not merge yet' })" >> $env:GITHUB_OUTPUT
          $log | Out-File vt-result.txt

      - name: Open the engine bump PR
        if: steps.compare.outputs.update == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pinned = "${{ steps.compare.outputs.pinned }}"
          $latest = "${{ steps.compare.outputs.latest }}"
          (Get-Content scripts/postinstall.js -Raw) -replace `
            "WHISPER_CPP_VERSION = '$pinned'", "WHISPER_CPP_VERSION = '$latest'" |
            Set-Content scripts/postinstall.js -NoNewline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "engine-update/$latest"
          git add scripts/postinstall.js
          git commit -m "chore(engine): bump whisper.cpp $pinned -> $latest"
          git push origin "engine-update/$latest"
          $vt = if (Test-Path vt-result.txt) { Get-Content vt-result.txt -Raw } else { 'not run' }
          $lines = @(
            'Automated engine update check.',
            '',
            '| Check | Result |',
            '| --- | --- |',
            '| Transcription (nya.wav, tiny model) | ${{ steps.transcribe.outputs.result }} |',
            '| VirusTotal | ${{ steps.virustotal.outputs.result }} |',
            '',
            '<details><summary>VirusTotal log</summary>',
            '<pre>',
            $vt,
            '</pre>',
            '</details>',
            '',
            "Upstream release notes: https://github.com/ggml-org/whisper.cpp/releases/tag/$latest",
            '',
            'Merging this PR changes which engine the next release bundles. The release',
            'workflow will re-verify with a real transcription and a VirusTotal scan.'
          )
          Set-Content -Path pr-body.md -Value ($lines -join "`n")
          gh pr create --title "chore(engine): whisper.cpp $pinned -> $latest" `
            --body-file pr-body.md --head "engine-update/$latest" --base main
