# Version-update PRs are disabled (open-pull-requests-limit: 0); Dependabot
# only opens security PRs, managed in Settings > Code security.
# The node-llama group keeps the core package and its platform binaries
# aligned in a single security PR (mismatched versions break native loading).
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    groups:
      node-llama-cpp:
        applies-to: security-updates
        patterns:
          - 'node-llama-cpp'
          - '@node-llama-cpp/*'
    commit-message:
      prefix: 'chore(deps)'
